name: Release

# Turns a version tag (v1.2.3) into a GitHub release and ties it to the
# roadmap (docs/releases.md). The release notes are put together from:
#   1. Highlights: the message of the annotated tag (hand-written bullets,
#      `git tag -a v1.2.3 -F notes.md`);
#   2. Roadmap items: the closed issues of the milestone named like the tag;
#   3. Pull requests: GitHub's generated notes, grouped by label
#      (.github/release.yml), with the full-changelog link;
#   4. All commits since the previous tag, collapsed.
# Afterwards the milestone is closed (not for pre-releases such as
# v1.2.0-rc.1). The container image for the tag is built by image.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release
  issues: write     # close the milestone

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Skip if the release exists
        id: exists
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists already."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.exists.outputs.skip != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # checkout leaves the tag without its annotation; fetch the tag object.
      - name: Fetch tag annotation
        if: steps.exists.outputs.skip != 'true'
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Find milestone
        if: steps.exists.outputs.skip != 'true'
        id: milestone
        run: |
          number=$(gh api "repos/$GH_REPO/milestones?state=all&per_page=100" \
            --jq ".[] | select(.title == \"$TAG\") | .number")
          if [ -z "$number" ]; then
            echo "::warning::No milestone named $TAG - release notes without roadmap items."
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.exists.outputs.skip != 'true'
        env:
          MILESTONE: ${{ steps.milestone.outputs.number }}
        run: |
          # Previous release tag reachable from this one (empty for the first).
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)

          {
            if [ "$(git cat-file -t "$TAG")" = tag ]; then
              # Tag message without its subject line ("openLitfass v1.2.3").
              highlights=$(git tag -l --format='%(contents:body)' "$TAG" | sed '/-----BEGIN/,$d')
              if [ -n "$(echo "$highlights" | tr -d '[:space:]')" ]; then
                echo "## Highlights"
                echo
                echo "$highlights"
                echo
              fi
            else
              echo "::warning::$TAG is a lightweight tag - no highlights." >&2
            fi

            if [ -n "$MILESTONE" ]; then
              echo "## Roadmap items"
              echo
              # shellcheck disable=SC2016 # jq expression, not shell
              gh issue list --milestone "$TAG" --state closed --limit 500 \
                --json number,title,labels \
                --jq '.[] | "- \(.title) (#\(.number))" + (if (.labels | length) > 0 then " `" + ([.labels[].name] | join("`, `")) + "`" else "" end)'
              echo
              echo "Milestone: https://github.com/$GH_REPO/milestone/$MILESTONE?closed=1"
              echo
            fi

            echo "Container image: \`ghcr.io/$GH_REPO:${TAG#v}\`"
            echo
          } > notes.md

          {
            range="$TAG"; label="all commits"
            if [ -n "$prev" ]; then range="$prev..$TAG"; label="commits since $prev"; fi
            count=$(git rev-list --count --no-merges "$range")
            echo
            echo "<details><summary>$count $label</summary>"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
            echo
            echo "</details>"
          } > commits.md

          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac

          # --generate-notes appends merged PRs and the full-changelog link.
          gh release create "$TAG" --verify-tag --title "openLitfass $TAG" \
            --notes-file notes.md --generate-notes $pre

          # Append the commit list after GitHub's generated part.
          gh release view "$TAG" --json body --jq .body > body.md
          cat commits.md >> body.md
          gh release edit "$TAG" --notes-file body.md
          cat body.md

      - name: Close milestone
        if: steps.exists.outputs.skip != 'true' && steps.milestone.outputs.number != '' && !contains(github.ref_name, '-')
        env:
          MILESTONE: ${{ steps.milestone.outputs.number }}
        run: |
          open=$(gh api "repos/$GH_REPO/milestones/$MILESTONE" --jq .open_issues)
          if [ "$open" -gt 0 ]; then
            echo "::warning::Milestone $TAG still has $open open issue(s); move them to the next milestone."
          fi
          gh api -X PATCH "repos/$GH_REPO/milestones/$MILESTONE" -f state=closed >/dev/null
          echo "Closed milestone $TAG."

name: Image

# Builds the openLitfass runtime image (Containerfile: compiled fetch +
# build-site binaries and the core frontend) and pushes it to the GitHub
# Container Registry as ghcr.io/<owner>/<repo>. Instances never compile
# anything - their workflow just runs this image (see https://docs.openlitfass.org/?page=setup).
#
# Tags: latest (main), sha-<short> (every main build), and v1.2.3 / 1.2
# for git tags like v1.2.3.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'web/**'
      - 'Containerfile'
      - '.github/workflows/image.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gate: nothing is pushed if the image has fixable CRITICAL/HIGH
      # vulnerabilities or the Containerfile a serious misconfiguration.
      # Runs before setup-buildx, whose builder would not load the image
      # into the local Docker daemon.
      - name: Trivy gate
        run: scripts/check.sh image

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The built-in GITHUB_TOKEN may push to this repository's packages
      # (job permission packages: write) - no personal token needed.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # amd64 for hosted runners/servers, arm64 for small self-hosted boxes
      # (Raspberry Pi & co.).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

# Checks the Go backend on every push and pull request. Every step calls
# scripts/check.sh, which runs the tools in pinned Docker images - the same
# command works locally, so a green local run means a green CI run.
# What has been verified beyond CI: https://docs.openlitfass.org/?page=development#verified-against-real-sources
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cheapest checks first.
      - name: gofmt
        run: scripts/check.sh fmt

      - name: go vet
        run: scripts/check.sh vet

      - name: golangci-lint
        run: scripts/check.sh lint

      - name: go test -race
        run: scripts/check.sh test

      # Build the example instance site end to end.
      - name: build-site (example-instance)
        run: scripts/check.sh smoke

      - name: govulncheck
        run: scripts/check.sh vuln

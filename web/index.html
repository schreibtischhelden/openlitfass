<!DOCTYPE html>
<html lang="{{.Language}}">
<head>
<!-- Template: wird von build-site (backend/cmd/build-site) mit den Werten
     aus <instance>/instance.json gerendert, nicht direkt ausliefern. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{.Title}}</title>
{{if .Description}}<meta name="description" content="{{.Description}}">{{end}}
{{if .ThemeColor}}<meta name="theme-color" content="{{.ThemeColor}}">{{end}}
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<!-- Instanz-Theme: überschreibt Tokens aus tokens.css. Der Kern liefert
     eine leere Datei, die Instanz ersetzt sie über site/css/theme.css. -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="app-header__inner">
      <a class="logo" href="#">
        <!-- Logo: <instance>/site/logo.svg, sonst web/logo.svg (inline
             eingefügt, damit currentColor und Theme-Klassen greifen). -->
        {{.Logo}}
        <span>{{.Name}}</span>
      </a>
      <button class="icon-btn" id="searchToggle" type="button" aria-label="Suche öffnen" aria-expanded="false" aria-controls="searchBar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
      </button>
    </div>
    <div class="search-bar" id="searchBar" hidden>
      <input type="search" id="searchInput" placeholder="Flohmarkt, Lesung, Yoga …" aria-label="Events durchsuchen" autocomplete="off">
    </div>
  </header>

  <!-- Liste und "Gemerkt": Kategorie-Menü + Schnellfilter sichtbar -->
  <nav class="category-menu" id="categoryMenu" aria-label="Kategorien"></nav>
  <nav class="quick-filters" id="quickFilters" aria-label="Schnellfilter"></nav>

  <main class="content" id="main" tabindex="-1">
    <section id="viewList" class="view" aria-labelledby="listHeading">
      <h1 class="sr-only" id="listHeading">Termine</h1>
      <p class="result-count" id="resultCount" role="status"></p>
      <div id="eventGroups"></div>
      <div class="empty-state" id="emptyState" hidden></div>
    </section>

    <article id="viewDetail" class="view detail" hidden></article>

    <section id="viewAbout" class="view about" hidden></section>

    <footer class="site-footer" id="siteFooter"></footer>
  </main>

  <nav class="bottom-nav" aria-label="Ansicht">
    <a class="bottom-nav__item" href="#" data-view="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/></svg>
      <span>Termine</span>
    </a>
    <a class="bottom-nav__item" href="#gemerkt" data-view="saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873l-6.158 -3.245"/></svg>
      <span>Gemerkt <span class="badge" id="savedCount" hidden></span></span>
    </a>
    <a class="bottom-nav__item" href="#ueber" data-view="about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></svg>
      <span>Über</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<noscript><p class="noscript">Dieser Kalender braucht JavaScript.</p></noscript>
<script src="js/app.js" defer></script>
</body>
</html>

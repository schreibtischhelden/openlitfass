name: Build image

# Builds the openlitfass runtime image (Containerfile: compiled
# fetch + build-site binaries and the core frontend) and pushes it to the
# Forgejo/Codeberg container registry. Instances never compile anything -
# their workflow just pulls this image (see docs/instance.md).
#
# Runs when anything that ends up in the image changes.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'Containerfile'
      - '.forgejo/workflows/build-image.yml'
  workflow_dispatch: {}

env:
  # ADJUST: registry host + owner.
  #   Codeberg:     codeberg.org/<user-or-org>/openlitfass
  #   Self-hosted:  <your-forgejo-host>/<owner>/openlitfass
  IMAGE: codeberg.org/YOUR_USERNAME/openlitfass
  REGISTRY_USER: YOUR_USERNAME

jobs:
  build:
    # ADJUST to your instance's runner label (Settings > Actions > Runners).
    # "codeberg-small" is Codeberg's own hosted label.
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install buildah
        run: apt-get update -qq && apt-get install -y buildah ca-certificates

      # Codeberg's (and many self-hosted) runners are rootless
      # Podman-in-LXC: no docker daemon, no /var/run/docker.sock, so
      # `docker build` / docker/build-push-action don't work here. buildah
      # needs two flags in that nested-container environment:
      #   --storage-driver=vfs   overlay needs FUSE, unavailable here
      #   --isolation=chroot     avoids namespace ops needing privileges
      - name: Build image
        run: |
          buildah build \
            --storage-driver=vfs \
            --isolation=chroot \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.sha }}" \
            -f Containerfile \
            .

      # Requires the repository secret REGISTRY_TOKEN: a personal access
      # token with scope write:packages (Settings -> Applications -> Access
      # Tokens), added under Settings -> Actions -> Secrets. The automatic
      # FORGEJO_TOKEN cannot push to the container registry.
      - name: Push image
        run: |
          for tag in latest "${{ github.sha }}"; do
            buildah push \
              --storage-driver=vfs \
              --creds "$REGISTRY_USER:${{ secrets.REGISTRY_TOKEN }}" \
              "$IMAGE:$tag"
          done
